<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cap Bright White/Silver Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Leaf Lush Emerald Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" flood-color="#000" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#squircleGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Graduation Cap Group -->
  <g filter="url(#subtleShadow)">
    <!-- Cap Skull Arc (Underneath) -->
    <path
      d="M32 52 V 64 C 32 73, 64 78, 64 78 C 64 78, 96 73, 96 64 V 52"
      fill="none"
      stroke="url(#capGrad)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M36 55 C 36 66, 64 72, 64 72 C 64 72, 92 66, 92 55"
      fill="#f8fafc"
      opacity="0.12"
    />

    <!-- Diamond Mortarboard Top -->
    <polygon
      points="64,24 106,42 64,60 22,42"
      fill="url(#capGrad)"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Mortarboard Top Button -->
    <circle cx="64" cy="42" r="3.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />

    <!-- Tassel Cord curving down towards the leaf -->
    <path
      d="M64 42 Q 86 44, 91 56 Q 94 62, 92 70"
      fill="none"
      stroke="#10b981"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- The Leaf (Tassel End Transformation) -->
    <!-- Leaf Body -->
    <path
      d="M92 68 C 80 72, 74 86, 84 98 C 96 102, 106 90, 92 68 Z"
      fill="url(#leafGrad)"
      stroke="#059669"
      stroke-width="1"
    />

    <!-- Leaf Center Vein -->
    <path
      d="M91 72 Q 87 84, 85 96"
      fill="none"
      stroke="#ecfdf5"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Leaf Side Veins -->
    <path
      d="M89 79 Q 84 81, 82 84 M88 85 Q 85 88, 83 91"
      fill="none"
      stroke="#ecfdf5"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>
